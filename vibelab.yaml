app:
  id: "7704536495876636691"
  name: "青玉棋会"
  slogan: "在环绕棋盘上招募英雄、搭配羁绊，赢下四人棋会"
  description: |
    青玉棋会是一款面向 PICO 头显的单人自走棋试玩游戏。你将与三名 AI 棋手同场经营阵容，在环绕式四人棋盘上经历招募、布阵和自动战斗。选择英雄、安排前后排，观察英雄交锋与技能效果；对局逐步淘汰棋手，最后决出冠军。准备阶段可以提前确认开始战斗，交战时也能继续整理备战席和经营商店。

    - 十六名英雄：四个阵营、四种职业，三个同名同星英雄自动合成，最高三星；四名棋手共用有限卡池，抽卡概率随人口等级变化。
    - 羁绊搭配：八种羁绊按上场的不同英雄激活，面板显示人数、门槛和效果，护甲与魔抗提供不同的阵容反制。
    - 经营决策：每轮基础五金币，另有胜利、利息和连胜连败奖励；连续二至三场额外一金、四场二金、五场以上三金，平局清零。
    - 空间布阵：使用手柄射线或眼手交互招募和拖动棋子，在八乘八棋盘上调整站位，也可拖到商店卖出；交战中的上场棋子锁定，经营带来的合成和补位在下一轮生效。
    - 自动战斗：近战挥砍、远程箭矢与能量球配合各英雄技能图案、治疗和护盾效果，战斗超时自动加速，实时显示排名与终局名次。

    打开应用后选择“开始棋会”，通过前下方商店购买英雄并布阵，点击“准备完毕”进入战斗。终局可选择“再来一局”或“退出”。适合希望在空间棋盘中体验阵容搭配和轻量策略的玩家。当前为 V1.10.0 试玩版本；展示图片和视频沿用早期试玩版实机素材，实际内容以当前版本为准。
  tags: [ "策略解谜" ]
  category: "game"
  icon: "assets/icon.jpg"
  landscape: "assets/landscape.png"
  detail_images:
    - "assets/detail-1.png"
    - "assets/detail-2.png"
    - "assets/detail-3.png"
    - "assets/detail-4.png"
    - "assets/detail-5.png"
  videos:
    - file: "assets/demo.mp4"
      cover: "assets/demo-cover.png"
version:
  name: "V1.10.0"
  notes: |
    新增连胜、连败金币奖励：二至三场加一金，四场加二金，五场以上加三金，平局清零；真人与 AI 遵循相同规则。
    延长技能特效至 1.2–1.8 秒并增加淡出，战斗二倍速下仍保持可读时长；远程普攻新增箭矢、能量球与拖尾。
    英雄扩展至十六名，加入有限共享卡池、按人口等级抽卡、魔抗反制和自动布阵评分。
    支持交战期间经营商店与整理备战席，上场棋子锁定，相关合成和补位延至下轮。
    改善拖动与卖出反馈、英雄状态条和品质边框；玩家淘汰立即结算，新增居中名次弹窗、再来一局与退出。
    修复重开复用随机种子，调整 AI 分步经营时机；三人阶段使用镜像对局，长时间战斗自动加速。
build:
  repo_url: "https://github.com/hyd1059320441-bot/mini-auto-chess"
  repo_visibility: "private"
  tech_stack: "android_spatial"
  ai_tool: "Trae"
  ai_model: "GPT-6"
  features:
    - controller_support
    - hand_tracking
    - eye_tracking
  teammates: []
